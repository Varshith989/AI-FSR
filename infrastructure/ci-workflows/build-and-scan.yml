name: Build and Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SAST Security Checks
        run: |
          pip install bandit safety
          bandit -r backend/ -ll || true
          safety check || true

      - name: Docker Build & Vulnerability Scan
        run: |
          docker build -t safefood-backend:latest -f infrastructure/docker/backend.Dockerfile .
