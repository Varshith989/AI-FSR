apiVersion: apps/v1
kind: Deployment
metadata:
  name: safefood-backend
  labels:
    app: safefood-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: safefood-backend
  template:
    metadata:
      labels:
        app: safefood-backend
    spec:
      containers:
      - name: backend
        image: safefood-backend:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: safefood-config
        - secretRef:
            name: safefood-secrets
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "250m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: safefood-backend-service
spec:
  selector:
    app: safefood-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
