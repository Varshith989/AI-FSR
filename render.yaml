services:
  - type: web
    name: safefood-ai
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -c "from backend.database import engine, Base, SessionLocal; from data.seeders.seed_data import seed_database; Base.metadata.create_all(bind=engine); db = SessionLocal(); seed_database(db); db.close()"
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./safefood.db
      - key: LLM_PROVIDER
        value: mock
      - key: EMBEDDING_PROVIDER
        value: mock
